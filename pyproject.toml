[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchforge"
version = "1.0.0"
description = "PatchForge AI: Unified Autonomous Vulnerability Remediation and Formal Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "networkx>=3.2",
    "z3-solver>=4.12",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-go>=0.25",
    "boto3>=1.34",
    "botocore>=1.34",
    "anthropic>=0.39",
    "openai>=1.50",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "gitpython>=3.1.0",
    "pygithub>=2.1.0",
    "docker>=7.0.0",
    "moto>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
patchforge = "patchforge.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
